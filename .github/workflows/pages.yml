name: Deploy demo to GitHub Pages

# Builds a static, read-only copy of the storefront with sample products and
# publishes it to GitHub Pages. Requires Settings -> Pages -> Source:
# "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Create sample data
        run: |
          python manage.py migrate --noinput
          python manage.py seed_products
          python manage.py seed_attributes
      - name: Build static site
        run: >
          python manage.py build_static_demo --demo-data --output _site
          --base-path "/${{ github.event.repository.name }}/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
