{% if is_paginated %}
<div class="pagination">
    {% if page_obj.has_previous %}
        <a href="{% querystring page=page_obj.previous_page_number %}">قبلی</a>
    {% endif %}
    <span class="current">{{ page_obj.number }} از {{ page_obj.paginator.num_pages }}</span>
    {% if page_obj.has_next %}
        <a href="{% querystring page=page_obj.next_page_number %}">بعدی</a>
    {% endif %}
</div>
{% endif %}
