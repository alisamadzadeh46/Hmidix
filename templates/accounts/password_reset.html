{% extends 'base.html' %}

{% block title %}فراموشی رمز عبور | hamidix.ir{% endblock %}

{% block content %}
<div class="auth-wrap">
    <div class="card">
        <h1>فراموشی رمز عبور</h1>
        <p class="subtitle">ایمیل خود را وارد کنید تا لینک بازیابی ارسال شود.</p>

        <form method="post" class="auth-form">
            {% csrf_token %}
            {% if form.errors %}
                <div class="form-errors">{{ form.email.errors }}</div>
            {% endif %}
            <div class="input-group">
                <label>آدرس ایمیل</label>
                <input type="email" name="email" placeholder="example@gmail.com" required autofocus>
            </div>
            <button type="submit" class="btn btn-block">
                <i class="fas fa-paper-plane"></i> ارسال لینک بازیابی
            </button>
        </form>

        <div style="text-align:center; margin-top:16px; font-size:14px;">
            <a href="{% url 'accounts:login' %}">بازگشت به صفحه ورود</a>
        </div>
    </div>
</div>
{% endblock %}
