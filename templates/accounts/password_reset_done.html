{% extends 'base.html' %}

{% block title %}ایمیل ارسال شد | hamidix.ir{% endblock %}

{% block content %}
<div class="auth-wrap">
    <div class="card" style="text-align:center;">
        <div style="font-size:56px; color:var(--primary); margin-bottom:16px;">
            <i class="fas fa-envelope-circle-check"></i>
        </div>
        <h1>ایمیل ارسال شد</h1>
        <p class="subtitle" style="margin-top:12px; line-height:1.8;">
            اگر این ایمیل در سیستم ما ثبت شده باشد،<br>
            لینک بازیابی رمز عبور به آن ارسال شد.<br>
            <small style="color:#888;">صندوق ورودی و پوشه اسپم را بررسی کنید.</small>
        </p>
        <a href="{% url 'accounts:login' %}" class="btn" style="margin-top:24px; display:inline-block;">
            <i class="fas fa-arrow-right"></i> بازگشت به ورود
        </a>
    </div>
</div>
{% endblock %}
