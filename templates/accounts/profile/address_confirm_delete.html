{% extends 'accounts/profile/_base.html' %}

{% block title %}حذف آدرس | hamidix.ir{% endblock %}

{% block profile %}
<h1 class="profile-title">حذف آدرس</h1>
<p>آیا از حذف آدرس «{{ object.title }}» مطمئن هستید؟</p>
<form method="post" class="form-actions" style="margin-top:18px;">
    {% csrf_token %}
    <button type="submit" class="btn danger-btn">بله، حذف کن</button>
    <a href="{% url 'accounts:addresses' %}" class="btn btn-outline">انصراف</a>
</form>
{% endblock %}
