{% extends 'accounts/profile/_base.html' %}

{% block title %}اطلاعات حساب | hamidix.ir{% endblock %}

{% block profile %}
<h1 class="profile-title">اطلاعات حساب</h1>
<form method="post" class="profile-form" style="max-width:480px;">
    {% csrf_token %}
    <div class="input-group">
        <label>شماره تلفن</label>
        <input type="text" value="{{ user.phone }}" disabled>
        <small class="muted">شماره تلفن قابل تغییر نیست.</small>
    </div>
    <div class="input-group"><label>نام و نام خانوادگی</label>{{ form.full_name }}{{ form.full_name.errors }}</div>
    <div class="input-group"><label>ایمیل</label>{{ form.email }}{{ form.email.errors }}</div>
    <div class="form-actions">
        <button type="submit" class="btn">ذخیره تغییرات</button>
    </div>
</form>
{% endblock %}
