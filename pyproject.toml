[project]
name = "hamidix"
description = "Online store for CCTV cameras and accessories, built with Django."
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["*/migrations/*", "_legacy"]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear, django-specific checks
select = ["E", "W", "F", "I", "B", "DJ"]

[tool.ruff.lint.isort]
known-first-party = ["accounts", "config", "core", "orders", "shop"]
